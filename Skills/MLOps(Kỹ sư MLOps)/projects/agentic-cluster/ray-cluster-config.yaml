# Standard 2026 Ray Cluster Configuration for Kubernetes
apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: agentic-mlops-cluster
spec:
  rayVersion: '2.10.0' # Hoặc phiên bản mới nhất năm 2026
  headGroupSpec:
    rayStartParams:
      dashboard-host: '0.0.0.0'
    template:
      spec:
        containers:
          - name: ray-head
            image: rayproject/ray:2.10.0-py310 # Thay đổi tùy theo runtime
            resources:
              limits:
                cpu: 2
                memory: 4Gi
              requests:
                cpu: 2
                memory: 4Gi
            ports:
              - containerPort: 6379
                name: gcs
              - containerPort: 8265
                name: dashboard
              - containerPort: 10001
                name: client
  workerGroupSpecs:
    - replicas: 2
      minReplicas: 1
      maxReplicas: 10
      groupName: gpu-worker-group
      rayStartParams: {}
      template:
        spec:
          containers:
            - name: ray-worker
              image: rayproject/ray:2.10.0-py310-gpu
              resources:
                limits:
                  cpu: 4
                  memory: 16Gi
                  nvidia.com/gpu: 1 # Yêu cầu 1 card GPU
                requests:
                  cpu: 4
                  memory: 16Gi
                  nvidia.com/gpu: 1
          # Sử dụng tolerations nếu node GPU được taints
          tolerations:
            - key: "nvidia.com/gpu"
              operator: "Exists"
              effect: "NoSchedule"
